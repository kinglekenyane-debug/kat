<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KAT"><meta name="description" content="KAT, Keeping Attendance Today. Attendance registers for Ficksburg High School."><title>KAT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#12329A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first app column for teachers (max 560px), wide fluid board for office screens (max 1240px). */
:root {
  --primary: #12329A;
  --accent: #F2C024;
  --red: #C8102E;
  --primary-ink: var(--primary);
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --surface-2: #EEF1F6;
  --line: #E2E5EA;
  --line-soft: #ECEEF2;
  --fg: #1A1D23;
  --muted: #5A6170;
  --faint: #6B7280;
  --ok-bg: #E6F4EA; --ok-fg: #1B6B34;
  --late-bg: #FFE7B3; --late-fg: #7A4100; --late-row: #FFFBF0;
  --abs-row: #FEF3F2; --abs-soft: #FDE8EB; --abs-line: #F4B4BF; --abs-ink: #A50E26;
  --wait-bg: #FFF7E6; --wait-line: #F5D48A; --wait-dot: #D99100;
  --info-bg: #E8F2FF; --info-fg: #1D4F91;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary-ink: color-mix(in srgb, var(--primary) 45%, #ffffff);
    --bg: #111318; --surface: #1B1E25; --surface-2: #252a33; --line: #2E333D; --line-soft: #262A33;
    --fg: #ECEEF2; --muted: #A4ABB8; --faint: #9AA1AE;
    --ok-bg: #173523; --ok-fg: #7FD49B;
    --late-bg: #4A3510; --late-fg: #FFD58A; --late-row: #241E12;
    --abs-row: #2A1719; --abs-soft: #3A1A20; --abs-line: #6B2633; --abs-ink: #FF8FA0;
    --wait-bg: #2C2412; --wait-line: #6B5420; --wait-dot: #E6A82A;
    --info-bg: #15263D; --info-fg: #9CC3F5;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary-ink: color-mix(in srgb, var(--primary) 45%, #ffffff);
  --bg: #111318; --surface: #1B1E25; --surface-2: #252a33; --line: #2E333D; --line-soft: #262A33;
  --fg: #ECEEF2; --muted: #A4ABB8; --faint: #9AA1AE;
  --ok-bg: #173523; --ok-fg: #7FD49B;
  --late-bg: #4A3510; --late-fg: #FFD58A; --late-row: #241E12;
  --abs-row: #2A1719; --abs-soft: #3A1A20; --abs-line: #6B2633; --abs-ink: #FF8FA0;
  --wait-bg: #2C2412; --wait-line: #6B5420; --wait-dot: #E6A82A;
  --info-bg: #15263D; --info-fg: #9CC3F5;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--primary); }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary-ink); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.app { min-height: 100%; display: flex; flex-direction: column; }
.col { width: 100%; max-width: 560px; margin: 0 auto; }
.wide { width: 100%; max-width: 1240px; margin: 0 auto; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header band */
.band { background: var(--primary); color: #fff; border-bottom: 4px solid var(--accent); box-shadow: 0 3px 0 var(--red); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.band-in { display: flex; flex-direction: column; gap: 10px; padding-block: 12px 14px; }
.band-row { display: flex; align-items: center; gap: 8px; }
.band h1 { font-size: 18px; font-weight: 700; line-height: 1.2; }
.band .sub { font-size: 12px; opacity: .88; }
.iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: inherit; border-radius: 10px; flex: none; }
.iconbtn:hover { background: rgba(255,255,255,.1); }
.band .back { margin-left: -10px; }
.band .ghost { font-size: 13px; font-weight: 600; padding: 8px 10px; border: 1.5px solid rgba(255,255,255,.6); border-radius: 8px; background: transparent; color: #fff; min-height: 38px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stat { background: rgba(255,255,255,.12); border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; }
.stat b { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; opacity: .9; }
.home-band .band-in { padding-block: 18px 30px; gap: 16px; }
.crestbox { width: 60px; height: 50px; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 4px; flex: none; }
.crestbox img { width: 100%; height: 100%; object-fit: contain; }

main.content { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-block: 16px 24px; }
.home-main { margin-top: -16px; position: relative; z-index: 21; }

/* cards */
.card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { padding: 0; gap: 0; overflow: hidden; }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.h2 { font-size: 16px; font-weight: 700; margin: 0 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.grow { flex: 1; min-width: 0; }

.pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.red { background: var(--abs-soft); color: var(--abs-ink); }
.pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
.pill.wait { background: var(--wait-bg); color: var(--late-fg); }
.pill.info { background: var(--info-bg); color: var(--info-fg); }
.pill.grey { background: var(--surface-2); color: var(--muted); }

.btn { min-height: 48px; border-radius: 12px; border: 0; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.big { min-height: 52px; font-size: 16px; }
.btn.line { background: transparent; color: var(--primary-ink); border: 1.5px solid var(--primary-ink); }
.btn.soft { background: var(--surface-2); color: var(--fg); }
.btn.sm { min-height: 38px; font-size: 13px; border-radius: 9px; padding: 0 12px; }
.btn.ok { background: #2E6B3F; }
.btn.danger { background: var(--red); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
.linkbtn { border: 0; background: none; color: var(--primary-ink); font-weight: 600; font-size: 14px; padding: 8px 0; text-align: left; min-height: 40px; }

.list-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; width: 100%; text-align: left; color: inherit; text-decoration: none; min-height: 56px; }
.list-row:last-child { border-bottom: 0; }
.list-row:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.ptile { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
.ptile small { font-size: 10px; color: var(--muted); line-height: 1; }
.ptile b { font-size: 16px; color: var(--primary-ink); line-height: 1.1; }
.go { font-size: 13px; font-weight: 700; color: var(--primary-ink); white-space: nowrap; }

.alertcard { background: var(--abs-soft); border: 1px solid var(--abs-line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 44px; width: 100%; text-align: left; color: var(--fg); }
.countdot { width: 32px; height: 32px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: none; }
.tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: 14px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow); border: 0; color: var(--fg); font-size: 13px; font-weight: 600; text-align: center; min-height: 44px; }
.tile svg { color: var(--primary-ink); }

/* learner rows */
.lrow { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border: 0; border-bottom: 1px solid var(--line-soft); background: var(--surface); text-align: left; color: var(--fg); }
.lrow.A { background: var(--abs-row); }
.lrow.L { background: var(--late-row); }
.lrow .no { width: 24px; font-size: 12px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.lrow .nm { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lrow .nm b { font-size: 15px; font-weight: 600; }
.lrow .nm span { font-size: 12px; color: var(--faint); }
.badge { min-width: 76px; text-align: center; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; flex: none; }
.badge.P { background: var(--ok-bg); color: var(--ok-fg); }
.badge.A { background: var(--red); color: #fff; }
.badge.L { background: var(--late-bg); color: var(--late-fg); }
.badge.N { background: var(--surface-2); color: var(--muted); }

.note { margin: 0; padding: 10px 16px; font-size: 13px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }
.note.info { background: var(--info-bg); color: var(--info-fg); border-color: transparent; }
.note.warn { background: var(--wait-bg); color: var(--late-fg); border-color: var(--wait-line); }
.note.red { background: var(--abs-soft); color: var(--abs-ink); border-color: var(--abs-line); }
.boxnote { border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.boxnote.info { background: var(--info-bg); color: var(--info-fg); }
.boxnote.warn { background: var(--wait-bg); color: var(--late-fg); }
.boxnote.ok { background: var(--ok-bg); color: var(--ok-fg); }
.boxnote.red { background: var(--abs-soft); color: var(--abs-ink); }

.footer-bar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 15; }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs button { flex: none; min-height: 40px; padding: 0 13px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.14); color: #fff; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #1A1D23; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 38px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }

/* forms */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.inp { min-height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); padding: 8px 12px; font-size: 15px; color: var(--fg); width: 100%; font-weight: 400; }
textarea.inp { min-height: 90px; resize: vertical; }
.inp:focus { border-color: var(--primary-ink); outline: none; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg); font-weight: 500; }
.check input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--primary); }
.radio-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); width: 100%; text-align: left; color: var(--fg); font-size: 15px; min-height: 48px; }
.radio-row[aria-checked="true"] { border-color: var(--primary-ink); background: color-mix(in srgb, var(--primary) 9%, var(--surface)); }
.radio-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--faint); flex: none; }
.radio-row[aria-checked="true"] .radio-dot { border: 6px solid var(--primary-ink); }

/* bottom nav */
.bnav { position: sticky; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bnav-in { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); padding-block: 4px 6px; }
.bnav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; min-height: 52px; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 500; }
.bnav button[aria-current="page"] { color: var(--primary-ink); font-weight: 700; box-shadow: inset 0 3px 0 var(--red); }
.credit { margin: 0; padding: 4px 16px 10px; text-align: center; font-size: 11px; color: var(--faint); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,14,25,.45); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88%; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-size: 18px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); background: #1A1D23; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; z-index: 80; max-width: min(92vw, 480px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.netbar { background: var(--wait-bg); color: var(--late-fg); border-bottom: 1px solid var(--wait-line); font-size: 13px; padding-block: 8px; }

/* office */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.kpi .s { font-size: 13px; font-weight: 600; }
.split { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.split > .mainpane { flex: 999 1 540px; min-width: 0; }
.split > .sidepane { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.ctiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ctile { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); text-align: left; color: var(--fg); min-height: 44px; }
.ctile .t { display: flex; justify-content: space-between; align-items: center; }
.ctile .t b { font-size: 18px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.ctile.in .dot { background: var(--ok-fg); }
.ctile.wait { background: var(--wait-bg); border-color: var(--wait-line); }
.ctile.wait .dot { background: var(--wait-dot); }
.ctile.none { background: var(--abs-soft); border-color: var(--abs-line); }
.ctile.none .dot { background: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n { font-variant-numeric: tabular-nums; }
tr.done td { background: color-mix(in srgb, var(--ok-bg) 45%, transparent); }

/* paper preview */
.paperwrap { overflow: auto; background: var(--surface-2); border-radius: 12px; padding: 12px; max-height: 70vh; }
.paper { background: #fff; color: #000; padding: 18px; font-family: Arial, Helvetica, sans-serif; font-size: 10px; width: max-content; min-width: 100%; box-shadow: 0 1px 4px rgba(0,0,0,.2); margin-bottom: 14px; }
.paperhead { display: flex; align-items: center; gap: 12px; }
.paperhead img { width: 64px; height: 64px; object-fit: contain; }
.paper h3 { font-size: 13px; text-align: left; margin: 0 0 2px; }
.paper .meta { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 6px 0 8px; font-size: 11px; }
.paper table { border-collapse: collapse; }
.paper td, .paper th { border: 1px solid #555; padding: 2px 4px; text-align: center; white-space: nowrap; font-weight: 400; }
.paper th { font-weight: 700; background: #f0f0f0; }
.paper td.l { text-align: left; }
.paper .sh { background: #d6d6d6; }
.paper .lt { background: #efefef; }
.paper .ab { color: #b00020; font-weight: 700; }
.paper .cv { color: #12329A; font-weight: 700; font-size: 8.5px; }
.paper .foot { margin-top: 8px; font-size: 9px; color: #333; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.cal .hd { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
.cal .d { min-height: 40px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 0; font-variant-numeric: tabular-nums; }
.cal .d.P { background: var(--ok-bg); color: var(--ok-fg); }
.cal .d.A { background: var(--red); color: #fff; }
.cal .d.L { background: var(--late-bg); color: var(--late-fg); }
.cal .d.H { background: transparent; color: var(--faint); border: 1px dashed var(--line); }
.cal .d.E { visibility: hidden; }

.welcome { min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.hero { background: var(--primary); color: #fff; border-bottom: 4px solid var(--accent); box-shadow: 0 3px 0 var(--red); }
.hero-in { padding-block: 34px 28px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.wordmark { font-size: 40px; font-weight: 800; letter-spacing: 3px; line-height: 1; }
.tagline { font-size: 16px; opacity: .95; }
.tagline b { color: var(--accent); font-weight: 800; }
.person { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); width: 100%; text-align: left; color: var(--fg); min-height: 60px; }
.person:hover { border-color: var(--primary-ink); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); color: var(--primary-ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
.schoolpick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); text-align: left; min-height: 60px; flex: 1 1 220px; }
.schoolpick[aria-pressed="true"] { border-color: var(--primary-ink); }
.schoolpick img { width: 42px; height: 42px; object-fit: contain; background: #fff; border-radius: 8px; padding: 2px; flex: none; }
.swatch { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); padding: 0; background: none; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, -8px); opacity: 0; } } }

.rowbtn { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; border: 0; background: none; text-align: left; color: inherit; padding: 0; min-height: 44px; }
.chip:disabled { opacity: .4; }
.inp:disabled { opacity: .7; }

/* ---- dates (all dates are local 'YYYY-MM-DD' strings) ---- */
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayISO = () => iso(new Date());
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dow = (s) => parse(s).getDay();
const fmtShort = (s) => { const d = parse(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtLong = (s) => { const d = parse(s); return DOW_LONG[d.getDay()] + ', ' + d.getDate() + ' ' + MON_LONG[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtDMY = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const stamp = () => todayISO() + ' ' + nowHM();
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const monthKey = (s) => s.slice(0, 7);

function cal(school) { return school.calendar || { terms: TERMS_2026, holidays: HOLIDAYS_2026 }; }
function inTerm(school, s) { return cal(school).terms.some((t) => s >= t.from && s <= t.to); }
function termOf(school, s) {
  const ts = cal(school).terms; const t = ts.find((x) => s >= x.from && s <= x.to);
  if (t) return t.n;
  const next = ts.find((x) => s < x.from); return next ? Math.max(1, next.n - 1) : 4;
}
function isSchoolDay(school, s) {
  const w = dow(s);
  return w !== 0 && w !== 6 && inTerm(school, s) && !cal(school).holidays.includes(s) && !(school.noSchool && school.noSchool[s]);
}
function schoolDays(school, from, to) {
  const out = []; let s = from;
  while (s <= to) { if (isSchoolDay(school, s)) out.push(s); s = addDays(s, 1); }
  return out;
}
function prevSchoolDays(school, s, n) {
  const out = []; let d = s;
  for (let i = 0; i < 400 && out.length < n; i++) { if (isSchoolDay(school, d)) out.push(d); d = addDays(d, -1); }
  return out;
}
function schoolDaysSince(school, from, to) { return Math.max(0, schoolDays(school, from, to).length - 1); }

// staff symbols as the school uses them: surname initial + first-name initial (Lekenyane King = LK)
function symbolGuess(name) {
  const w = (name || '').replace(/^(MR|MRS|MS|DR|MISS)\.?\s+/i, '').replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(Boolean);
  if (!w.length) return '';
  // "Ms N. Radebe" → initial first, surname last · "LEKENYANE K" (aSc) → surname first
  const firstIsInitial = w[0].length === 1 || (w.length > 1 && w[0] === w[0].toUpperCase() && w[0].length <= 3 && w[w.length - 1] !== w[w.length - 1].toUpperCase());
  const sur = firstIsInitial ? w[w.length - 1] : w[0], first = firstIsInitial ? w[0] : w[1] || '';
  return (sur[0] + (first[0] || '')).toUpperCase();
}
// symbols must be unique so sign-in finds one person: on a clash, use two surname letters (Mahase P = MAP), then a number
function uniqueSymbols(db) {
  const used = new Set(); const order = db.staff.slice().sort((a, b) => (a.role === 'teacher' ? 0 : 1) - (b.role === 'teacher' ? 0 : 1));
  order.forEach((x) => {
    let c = (x.code || symbolGuess(x.name)).toUpperCase();
    if (used.has(c)) { const g = symbolGuess(x.name); const w = (x.name || '').replace(/^(MR|MRS|MS|DR|MISS)\.?\s+/i, '').replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(Boolean); const sur = w.find((q) => q.length > 1 && q[0] === g[0]) || ''; const alt = (sur.slice(0, 2) + g.slice(1)).toUpperCase(); c = used.has(alt) ? c : alt; let n = 2; while (used.has(c)) c = g + n++; }
    x.code = c; used.add(c);
  });
}

/* ---- read helpers ---- */

function learnerShort(l) { return l ? l.first + ' ' + l.surname : 'Unknown learner'; }

function groupLabel(g) { return g.short + ' ' + g.label; }

}

  return n;
}

function lessonsFor(db, uid, date) {
  const ch = (db.changes || {})[uid + '|' + date] || {};
  const wd = ch.dayAs || dow(date);
  let ls = [];
  db.groups.filter((g) => g.teacherId === uid).forEach((g) => g.slots.filter((s) => s.d === wd).forEach((s) => ls.push({ gid: g.id, p: s.p, len: s.len || 1, orig: s.p })));

  const bells = dbBells(db);

function missedFor(db, school, uid, today, days) {

    const ch = (db.changes || {})[uid + '|' + d] || {};

/* ===== KAT tools: Excel class-list import, printable reports (PDF + Excel), saving files ===== */

/* ---- SA-SAMS / class-list import ---- */
function parseClassList(buf, filename) {
  const wb = XLSX.read(buf, { type: 'array' });
  let best = null;
  wb.SheetNames.forEach((sn) => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' });
    const res = parseRows(rows);
    if (res && (!best || res.learners.length > best.learners.length)) best = Object.assign(res, { sheet: sn });
  });
  if (!best) return { error: 'No class list found. KAT looks for a row with headings like "Acc No" and "Learner" or "Name".' };
  best.filename = filename;
  return best;
}
function parseRows(rows) {
  const s = (v) => String(v == null ? '' : v).trim();
  let h = -1, accCol = -1, nameCol = -1, genCol = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const r = rows[i].map(s);
    const a = r.findIndex((c) => /^acc(\.|ession)?\s*(no|nr|number|#)?\.?$/i.test(c));
    const n = r.findIndex((c) => /^(learner|name|learner name|student|surname, name)$/i.test(c));
    if (a >= 0 && n >= 0) { h = i; accCol = a; nameCol = n; genCol = r.findIndex((c) => /^(gender|gen|sex|g)$/i.test(c)); break; }
  }
  if (h < 0) return null;
  // details from the top of the sheet
  const top = rows.slice(0, h).map((r) => r.map(s));
  const flat = top.map((r) => r.join(' ')).join('\n');
  const info = { subject: '', grade: '', cls: '', teacher: '' };
  const m1 = flat.match(/([A-Za-z][A-Za-z &]+?)\s*\(Gr\s*0?(\d{1,2})\)/);
  if (m1) { info.subject = m1[1].trim(); info.grade = String(Number(m1[2])); }
  const m2 = flat.match(/Class\s*:\s*([0-9]{1,2}\s*[A-Za-z]?)/);
  if (m2) info.cls = m2[1].replace(/\s+/g, '').toUpperCase();
  const after = (label) => { for (const r of top) { const i = r.findIndex((c) => new RegExp('^' + label + '\\s*:?$', 'i').test(c)); if (i >= 0) { const v = r.slice(i + 1).find((c) => c); if (v) return v; } } return ''; };
  info.subject = info.subject || after('Subject');
  info.teacher = after('Teacher') || after('Educator');
  const g = after('Grade'); if (g) { const mm = g.match(/(\d{1,2})\s*([A-Za-z])?/); if (mm) { info.grade = info.grade || String(Number(mm[1])); if (mm[2] && !info.cls) info.cls = mm[1] + mm[2].toUpperCase(); } }
  if (!info.cls && info.grade) { const mm = flat.match(new RegExp('\\b' + info.grade + '\\s*([A-E])\\b')); if (mm) info.cls = info.grade + mm[1]; }
  const learners = [], seen = new Set(); let skipped = 0, footer = 0;
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i].map(s);
    if (/^(average|total|avg)/i.test(r[0] || '')) { footer++; continue; }
    const acc = (r[accCol] || '').replace(/\s/g, ''); const name = r[nameCol] || '';
    if (!/^\d{5,8}$/.test(acc) || name.indexOf(',') < 0) { if (acc || name) skipped++; continue; }
    if (seen.has(acc)) { footer++; continue; }
    seen.add(acc);
    const [sur, ...rest] = name.split(',');
    const gen = genCol >= 0 ? (r[genCol] || '').charAt(0).toUpperCase() : '';
    learners.push({ acc, surname: titleCase(sur.trim()), first: rest.join(',').trim(), gender: gen === 'F' || gen === 'M' ? gen : '' });
  }

}
function titleCase(s) { return s.toLowerCase().replace(/(^|[\s-])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase()); }

/* ---- report models: one model drives both the on-screen paper preview, the PDF and Excel ---- */
const TICK = { tick: true, t: '✓' };
function markCell(m) { if (m === 'P') return TICK; if (m === 'A') return { t: 'A', cls: 'ab' }; if (m === 'L') return { t: 'L' }; return ''; }
function printedLine(app, school) { return 'Printed ' + fmtDMY(todayISO()) + ' ' + nowHM() + ' by ' + (app.me ? app.me.name : '') + ' from KAT, the ' + school.short + ' attendance app. Test version with sample learners.'; }

function morningRegisterModel(app, cls, y, m) {
  const db = app.db, school = app.school, N = daysInMonth(y, m), today = todayISO();
  const days = []; for (let d = 1; d <= N; d++) days.push(y + '-' + pad(m + 1) + '-' + pad(d));
  // learners who left during or after this month stay on it, with their archive date
  const accs = classLearners(db, cls).concat(sortAcc(db, Object.keys(db.learners).filter((a) => { const l = db.learners[a]; return l.archiveDate && (l.lastCls || l.cls) === cls && l.archiveDate >= days[0]; }))); const c = db.classes.find((x) => x.id === cls);
  const head = ['#', 'Accession No', 'Learner Name', 'Date of Birth', 'Date of Registration', 'Date of Archive', 'Gender'].concat(days.map((d) => parse(d).getDate() + '\n' + DOW[dow(d)].charAt(0)), ['Total']);
  const rowsAll = accs.map((acc, i) => {
    const l = db.learners[acc]; let tot = 0;
    const cells = days.map((d) => {
      if (!isSchoolDay(school, d)) return { t: '', cls: 'sh' };
      if (d > today || (l.archiveDate && d > l.archiveDate)) return '';
      const mm = morningMark(db, acc, d); if (mm === 'P' || mm === 'L') tot++; return markCell(mm);
    });

  });

    if (!isSchoolDay(school, d)) return { t: '', cls: 'sh' };
    const r = db.registers[regKey('m', cls, d, 0)]; if (!r) return '';
    return String(accs.length - accs.filter((a) => r.marks[a] === 'A').length);
  }), ['']);

      meta: [['Month', MON_LONG[m] + ' ' + y], ['Class', cls], ['Register teacher', c ? staffName(db, c.teacherId) : ''], ['Learners', String(accs.length)]],
      head, body: rowsAll.slice(i, i + per), foot: last ? (anyCover ? [totals, coverRow] : [totals]) : null,
      widths: { 0: 6, 1: 15, 2: 40, 3: 15, 4: 15, 5: 13, 6: 9 },
      after: last ? signOff(db, c) : null,
      note: 'Key: ✓ present · A absent · L late · shaded = weekend or holiday · blank = not yet recorded' + (anyCover ? ' · a symbol at the bottom of a day = taken by that teacher (cover)' : '') + '. Learners ' + (i + 1) + ' to ' + Math.min(i + per, rowsAll.length) + ' of ' + rowsAll.length + '. ' + printedLine(app, school)

}

function groupDayMark(db, g, acc, d) {

function subjectRegisterModel(app, gid, y, m) {
  const db = app.db, school = app.school, g = db.groups.find((x) => x.id === gid), N = daysInMonth(y, m), today = todayISO();
  const days = []; for (let d = 1; d <= N; d++) days.push(y + '-' + pad(m + 1) + '-' + pad(d));

function modelToPdf(model) {

    if (c && c.cls === 'lt') o.styles.fillColor = [236, 236, 236];
    if (c && c.cls === 'ab') { o.styles.textColor = [176, 0, 32]; o.styles.fontStyle = 'bold'; }

  };

    if (pi > 0) doc.addPage();

    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    pg.title.forEach((t) => { doc.text(t, W / 2, y, { align: 'center' }); y += 5; });
    if (model.crest) y = Math.max(y, 24);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    let x = 10; pg.meta.forEach(([k, v]) => { doc.setFont('helvetica', 'bold'); doc.text(k + ':', x, y + 1); const kw = doc.getTextWidth(k + ': '); doc.setFont('helvetica', 'normal'); doc.text(v || '', x + kw, y + 1); x += kw + Math.max(doc.getTextWidth(v || '') + 10, 22); });
    y += 5;
    const many = pg.head.length > 20;
    const colStyles = {}; Object.keys(pg.widths || {}).forEach((k) => { colStyles[k] = { cellWidth: pg.widths[k] }; });

      startY: y, head: conv([pg.head]), body: conv(pg.body), foot: pg.foot ? conv(pg.foot) : undefined,
      theme: 'grid', margin: { left: 8, right: 8 }, showFoot: 'lastPage',
      styles: { fontSize: many ? 6.2 : 8.5, cellPadding: many ? 0.7 : 1.4, halign: 'center', valign: 'middle', lineColor: [90, 90, 90], lineWidth: 0.15, textColor: [0, 0, 0], overflow: 'linebreak' },
      headStyles: { fillColor: [235, 235, 235], textColor: [0, 0, 0], fontStyle: 'bold', fontSize: many ? 5.8 : 8 },
      footStyles: { fillColor: [245, 245, 245], textColor: [0, 0, 0], fontStyle: 'bold' },
      columnStyles: colStyles,
      didDrawCell: (d) => { drawTick(d); }
    });
    y = doc.lastAutoTable.finalY + 4;
    if (pg.after) {
      doc.autoTable({ startY: y, head: [pg.after.head], body: conv(pg.after.body), theme: 'grid', margin: { left: 8, right: 8 },
        styles: { fontSize: 7.5, cellPadding: 1.2, minCellHeight: pg.after.tall ? 9 : 0, lineColor: [90, 90, 90], lineWidth: 0.15, textColor: [0, 0, 0], valign: 'top' },
        headStyles: { fillColor: [235, 235, 235], textColor: [0, 0, 0] }, columnStyles: { 0: { cellWidth: 32 }, 1: { cellWidth: 45 } } });
      y = doc.lastAutoTable.finalY + 4;
    }

    doc.setFontSize(7); doc.setTextColor(60); doc.text(doc.splitTextToSize((pg.note || '').replace(/✓/g, 'tick'), W - 20), 10, Math.min(y + 2, doc.internal.pageSize.getHeight() - 8)); doc.setTextColor(0);

}
function modelToXlsx(model) {

      if (_dl === undefined) _dl = await window.claude.use('downloads');
      if (_dl) { await _dl.save({ filename, data }); return 'saved'; }
    }

  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();

/* ===== Timetable import (aSc Timetables PDF: one teacher per page) ===== */
const DAY_KEYS = { mo: 1, tu: 2, we: 3, th: 4, fr: 5, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5 };
function parseTimetablePage(items) {
  // items: [{s, x, y, h, w}] in PDF points, y grows upwards
  const it = items.map((i) => Object.assign({}, i, { s: i.s.trim() })).filter((i) => i.s);
  const titleI = it.filter((i) => /^(teacher|class|room)\s+\S/i.test(i.s)).sort((a, b) => b.h - a.h)[0];
  const title = titleI ? titleI.s : '';
  const kind = /^teacher/i.test(title) ? 'teacher' : /^class/i.test(title) ? 'class' : 'other';
  const name = title.replace(/^(teacher|class|room)\s+/i, '').trim();
  const days = it.filter((i) => DAY_KEYS[i.s.toLowerCase()] && i.h > 14).map((i) => ({ d: DAY_KEYS[i.s.toLowerCase()], y: i.y + i.h * 0.3 }));
  if (days.length < 3) return null;
  // header row: digits 1..N on one line, the highest such row
  const nums = it.filter((i) => /^\d{1,2}$/.test(i.s) && i.h > 10);
  const byY = {}; nums.forEach((i) => { const k = Math.round(i.y); (byY[k] = byY[k] || []).push(i); });
  const hy = Object.keys(byY).map(Number).filter((k) => byY[k].length >= 5).sort((a, b) => b - a)[0];
  if (hy === undefined) return null;
  const cols = byY[hy].map((i) => ({ p: Number(i.s), cx: i.x + i.w / 2 })).sort((a, b) => a.cx - b.cx);
  const brk = it.find((i) => /^break$/i.test(i.s) && Math.abs(i.y - hy) < 4);
  const times = it.filter((i) => /^\d{1,2}:\d\d\s*-\s*\d{1,2}:\d\d$/.test(i.s) && i.y < hy && i.y > hy - 30);
  const bells = cols.map((c) => { const t = times.sort((a, b) => Math.abs(a.x + a.w / 2 - c.cx) - Math.abs(b.x + b.w / 2 - c.cx))[0]; const m = t ? t.s.match(/(\d{1,2}:\d\d)\s*-\s*(\d{1,2}:\d\d)/) : null; return { p: c.p, t: m ? m[1].padStart(5, '0') : '', e: m ? m[2].padStart(5, '0') : '' }; });
  let brkTime = null;
  if (brk) { const t = times.find((x) => Math.abs(x.x + x.w / 2 - (brk.x + brk.w / 2)) < 25); if (t) { const m = t.s.match(/(\d{1,2}:\d\d)\s*-\s*(\d{1,2}:\d\d)/); brkTime = { t: m[1].padStart(5, '0'), e: m[2].padStart(5, '0'), after: cols.filter((c) => c.cx < brk.x).length }; } }
  const dayY = days.sort((a, b) => b.y - a.y);
  const rowOf = (y) => dayY.reduce((best, d) => (Math.abs(d.y - y) < Math.abs(best.y - y) ? d : best), dayY[0]);
  const big = it.filter((i) => i.y < hy - 20 && i.h >= 14 && !DAY_KEYS[i.s.toLowerCase()] && i !== titleI);
  const small = it.filter((i) => i.y < hy - 20 && i.h < 12 && !/generated|asc timetables/i.test(i.s));
  const lessons = [];
  big.forEach((c) => {
    const row = rowOf(c.y);
    const tops = small.filter((s) => s.y > c.y + 8 && s.y < c.y + c.h * 3.2 && rowOf(s.y) === row && s.x <= c.x + 3);
    const subj = tops.sort((a, b) => b.x - a.x)[0];
    const center = c.x + c.w / 2;
    const L = subj ? subj.x - 2 : center - 20;
    const R = 2 * center - L;
    const ps = cols.filter((k) => k.cx > L && k.cx < R).map((k) => k.p);
    if (!ps.length) return;
    lessons.push({ d: row.d, p: Math.min(...ps), len: ps.length, subject: subj ? subj.s : '', label: c.s.replace(/\s+/g, ' ') });
  });
  lessons.sort((a, b) => a.d - b.d || a.p - b.p);
  return { kind, name, bells, brk: brkTime, lessons };
}

/* ---- shared database (Supabase): every phone in the school sees the same registers ----
   Like a shared class file in the staffroom: each phone keeps its own copy to work from,
   and posts every change to the shared file as soon as there is signal. Other phones get
   the change a second later. Without signal, changes wait on the phone and go when it returns. */
const CLOUD_MAPS = ['registers', 'reasons', 'captured', 'changes', 'learners'];

    this.sb = this.on ? window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'kat-auth' } }) : null;
    this.last = {}; this.user = null; this.member = null; this.ready = false; this.busy = false; this.again = false; this.chan = null; this.lastSync = null; this.err = null;
  }

    store.flush = () => { this.soon(0); };
    this.sb.auth.getSession().then(({ data }) => { this.user = data.session ? data.session.user : null; if (this.user) this.start(); });
    setInterval(() => { if (this.ready && !store.offline) this.push(); }, 60000);

  }

    if (st === 'unknown') return { err: 'No staff member has the symbol "' + code + '" at this school. Check with the office.' };
    if (st === 'no-school') return { err: 'This school is not set up in KAT yet. The developer sets it up and gives the first admin a starting password.' };
    if (st === 'free') return { err: code + ' has no starting password yet. Ask the admin to give you one (Admin, Staff, your name, Give a starting password).' };

function YearEnd({ nav }) {

        ${pick === sc.id ? html`<div class="stack">

              <label class="f" for="dp">Starting password<input id="dp" class="inp" autocomplete="off" value=${f.pw} onInput=${(e) => setF(Object.assign({}, f, { pw: e.target.value }))} /></label></div>
            ${!set && html`<label class="check"><input type="checkbox" checked=${f.sample} onChange=${(e) => setF(Object.assign({}, f, { sample: e.target.checked }))} /><span>Fill with made-up sample staff and learners (for testing)<br /><span class="tiny muted">Untick for a real school: it starts empty, and the admin adds staff and enrols learners.</span></span></label>`}
            <div class="wrap"><button class="btn" disabled=${busy} onClick=${go}>${busy ? 'Working…' : set ? 'Give this starting password' : 'Set up ' + sc.short}</button><button class="btn soft" onClick=${() => { setPick(null); setMsg(''); }}>Cancel</button></div>
            ${set && html`<details class="small"><summary>Wipe this school (testing only)</summary><div class="stack" style="margin-top:8px"><span class="small muted">Deletes every record and login of ${sc.short}. This cannot be undone.</span><label class="f" for="dw">Type ${sc.short} to confirm<input id="dw" class="inp" value=${wipe} onInput=${(e) => setWipe(e.target.value)} /></label><button class="btn danger" disabled=${wipe.trim() !== sc.short} onClick=${async () => { const er = await app.cloud.wipe(sc.id); setWipe(''); setMsg(er ? 'Problem: ' + er : sc.short + ' was wiped.'); load(); }}>Wipe ${sc.short}</button></div></details>`}</div>`
          : html`<button class="btn line" onClick=${() => { setPick(sc.id); setMsg(''); setF({ name: '', code: '', pw: '', sample: !set }); }}>${set ? 'Give an admin a starting password' : 'Set up this school'}</button>`}
      </section>`; })}
      ${msg && html`<div class="boxnote info" role="status"><span>${msg}</span></div>`}
      <button class="btn line" onClick=${async () => { await app.cloud.signOut(); app.emit(); }}>Sign out of the developer account</button>
    </main><p class="credit">Developed by KK Lekenyane</p></div>`;
}

/* ================= morning register ================= */
function Register({ nav, cls, cover, date }) {
  const db = app.db, s = app.school, day = date || todayISO();
  const c = db.classes.find((x) => x.id === cls);
  const rec = app.getRegister('m', cls, day, 0);
  const [marks, setMarks] = useState(() => (rec ? Object.assign({}, rec.marks) : {}));
  const [dirty, setDirty] = useState(false);
  const accs = classLearners(db, cls);
  const isCover = !!cover || (c && c.teacherId !== app.me.id);
  let a = 0, l = 0; accs.forEach((x) => { if (marks[x] === 'A') a++; if (marks[x] === 'L') l++; });
  const tap = (x) => { setMarks(Object.assign({}, marks, { [x]: NEXT[marks[x] || 'P'] })); setDirty(true); };
  const submit = () => {
    const r = app.saveRegister({ kind: 'm', ref: cls, date: day, period: 0, marks, coverFor: isCover ? c.teacherId : null });
    setDirty(false);
    app.toast(r.synced ? 'Sent to the office. ' + a + ' absent, ' + l + ' late.' : 'Saved on this phone. It will send as soon as there is signal.');
  };
  const sub = fmtShort(day) + ' · Assembly' + (isCover ? ' · covering for ' + (c.teacherId ? staffName(db, c.teacherId) : 'no register teacher') : '');
  const cur = app.getRegister('m', cls, day, 0);
  let label = 'Submit register', bg = '';
  if (cur && !dirty) { label = cur.synced ? 'Sent ' + (cur.sentAt || cur.at).slice(11) + ' · tap to resend' : 'Saved on phone · tap to resend'; bg = 'ok'; }
  else if (cur && dirty) label = 'Submit changes';
  return html`<div class="app">
    <${Band} nav=${nav} title=${cls + ' · Morning register'} sub=${sub}>
      <div class="stats"><div class="stat"><b>${accs.length - a - l}</b><span>Present</span></div><div class="stat"><b>${a}</b><span>Absent</span></div><div class="stat"><b>${l}</b><span>Late</span></div></div>
    <//>
    <${NetBar} />
    <div class="col"><div class="note row" style="gap:10px"><label class="f grow" for="rd" style="flex-direction:row;align-items:center;gap:8px;font-weight:600">Day<input id="rd" type="date" class="inp" style="width:auto;min-height:38px" max=${todayISO()} value=${day} onInput=${(e) => e.target.value && e.target.value <= todayISO() && nav.replace('register', { cls, cover, date: e.target.value })} /></label>${day !== todayISO() && html`<span class="pill wait">Late entry</span>`}</div>
      ${day !== todayISO() && html`<p class="note warn">You are filling in ${fmtLong(day)}. ${cur && !cur.lateEntry ? 'This register was taken on the day.' : 'The office sees that it was filled in later.'}</p>`}
      ${!isSchoolDay(s, day) && html`<p class="note warn">${s.noSchool && s.noSchool[day] ? 'No school on this day: ' + s.noSchool[day] + '.' : 'This is not a school day in the calendar.'}</p>`}
      <p class="note">Everyone starts as present. Tap a learner once for <strong>Absent</strong>, again for <strong>Late</strong>, again to undo.</p></div>
    <main class="col" style="flex:1;background:var(--surface)">
      ${accs.map((x, i) => { const m = marks[x] || 'P'; const ln = db.learners[x]; return html`<button class=${'lrow ' + m} aria-label=${learnerName(ln) + ', ' + LOOK[m] + '. Tap to change.'} onClick=${() => tap(x)}><span class="no">${i + 1}</span><span class="nm"><b>${learnerName(ln)}</b><span>Acc. ${x}</span></span><span class=${'badge ' + m}>${LOOK[m]}</span></button>`; })}
    </main>
    <footer class="footer-bar"><div class="col gut stack" style="gap:10px">
      ${cur && !dirty && !cur.synced && html`<div class="boxnote info" role="status"><${Icon} n="wifi" s=${18} /><span><strong>Saved on this phone.</strong> It will send to the office as soon as there is signal.</span></div>`}
      ${cur && !dirty && a > 0 && html`<button class="btn line block" onClick=${() => nav.go('reasons', { cls })}>Add reasons for the ${a} absent</button>`}
      <button class=${'btn big block ' + bg} onClick=${submit}>${label}</button>
    </div></footer>
  </div>`;
}

          <span class="ptile" style="background:var(--abs-soft)"><small style="color:var(--abs-ink)">${x.kind === 'm' ? 'REG' : pLabel(x.p, x.len)}</small><b style="color:var(--abs-ink);font-size:13px">${x.kind === 'm' ? x.cls : x.g.label}</b></span>
          <span class="grow"><b>${x.kind === 'm' ? 'Morning register ' + x.cls : groupTitle(x.g)}</b><br /><span class="tiny muted">${x.kind === 'm' ? 'Assembly' : pLabel(x.p, x.len) + ' · ' + app.bellRange(x.p, x.len)}</span></span><span class="go">Take now</span></button>`)}

/* ================= cover a class ================= */
function Cover({ nav }) {

  const [g, setG] = useState('all'), [tab, setTab] = useState('m');
  const teachers = db.staff.filter((t) => t.id !== app.me.id && t.role === 'teacher').map((t) => ({ t, ls: lessonsFor(db, t.id, today), away: ((db.changes || {})[t.id + '|' + today] || {}) })).filter((x) => x.ls.length).sort((a, b) => (b.away.absent ? 1 : 0) - (a.away.absent ? 1 : 0) || a.t.name.localeCompare(b.t.name));
  const [tq, setTq] = useState('');
  if (tab === 'p') return html`<div class="app"><${Band} nav=${nav} title="Cover a class" sub="Take a register for a colleague who is away. No extra password needed.">
      <div class="tabs" role="tablist"><button role="tab" aria-selected="false" onClick=${() => setTab('m')}>Morning register</button><button role="tab" aria-selected="true">A lesson</button></div><//>
    <${NetBar} />
    <main class="col gut content">
      <div class="boxnote info"><span>You stay signed in as yourself. The register is saved as <strong>taken by ${app.me.code || app.me.name}</strong>, and your symbol shows at the bottom of that day on the teacher's printed register.</span></div>
      <input class="inp" placeholder="Search teacher by name or symbol" value=${tq} onInput=${(e) => setTq(e.target.value)} />
      ${teachers.filter((x) => !tq || (x.t.name + ' ' + (x.t.code || '')).toLowerCase().includes(tq.toLowerCase())).map((x) => html`<section class="card flat"><div class="between" style="padding:12px 16px 4px"><b>${x.t.name}${x.t.code ? ' (' + x.t.code + ')' : ''}</b>${x.away.absent ? html`<span class="pill red">Absent today</span>` : x.away.signout ? html`<span class="pill wait">Signed out ${x.away.signout}</span>` : null}</div>
        ${x.ls.map((l) => { const gg = db.groups.find((y) => y.id === l.gid); const done = db.registers[regKey('p', l.gid, today, l.p)]; return html`<button class="list-row" onClick=${() => nav.go('period', { gid: l.gid, p: l.p })}><span class="grow"><b>${groupTitle(gg)}</b><br /><span class="tiny muted">${pLabel(l.p, l.len)} · ${app.bellRange(l.p, l.len)}${gg.learners.length ? '' : ' · no class list yet'}</span></span>${done ? html`<span class="pill ok">Done${done.by !== gg.teacherId ? ' · ' + ((db.staff.find((s) => s.id === done.by) || {}).code || '') : ''}</span>` : html`<span class="go">Take</span>`}</button>`; })}</section>`)}
      ${teachers.length === 0 && html`<span class="small muted">No other teacher has lessons on the timetable today.</span>`}
    </main></div>`;
  const grades = app.school.grades;
  const list = db.classes.filter((c) => g === 'all' || String(c.grade) === g);
  return html`<div class="app"><${Band} nav=${nav} title="Cover a class" sub="Take a register for a colleague who is away. No extra password needed.">
      <div class="tabs" role="tablist"><button role="tab" aria-selected="true">Morning register</button><button role="tab" aria-selected="false" onClick=${() => setTab('p')}>A lesson</button></div><//>
    <${NetBar} />
    <main class="col gut content">
      <div class="boxnote info"><span>The register is saved as <strong>marked by ${app.me.name}, covering</strong>. The register teacher sees who marked it. You can only change it today.</span></div>
      <div class="chips">${['all'].concat(grades.map(String)).map((x) => html`<button class="chip" aria-pressed=${String(g === x)} onClick=${() => setG(x)}>${x === 'all' ? 'All grades' : 'Gr ' + x}</button>`)}</div>
      <div class="ctiles">${list.map((c) => { const x = classStatus(db, c.id, today); return html`<button class=${'ctile ' + x.st} onClick=${() => nav.go('register', { cls: c.id, cover: c.teacherId !== app.me.id })}><span class="t"><b>${c.id}</b><span class="dot"></span></span><span class="tiny" style="font-weight:600">${x.st === 'none' ? 'Not taken' : x.st === 'wait' ? 'Saved on phone' : x.p + ' of ' + x.n + ' present'}</span><span class="tiny muted">${c.teacherId ? staffName(db, c.teacherId) : 'No register teacher'}</span></button>`; })}</div>
    </main></div>`;
}

/* ================= period (subject) register ================= */
function Period({ nav, gid, p, pick: pickMode, pgid, date }) {
  const db = app.db, realToday = todayISO(), today = date || realToday;
  const groups = myGroups();
  const lessons = lessonsFor(db, app.me.id, today).filter((x) => !x.off || (x.gid === gid && x.p === p));
  if (gid && !lessons.some((x) => x.gid === gid && x.p === p)) { const gg = db.groups.find((x) => x.id === gid); const sl = gg && gg.slots.find((s) => s.p === p); lessons.push({ gid, p, len: (sl && sl.len) || 1 }); }
  lessons.sort((a, b) => a.p - b.p);
  const [cur, setCur] = useState(() => Math.max(0, lessons.findIndex((x) => x.gid === gid && x.p === p)));
  const [drafts, setDrafts] = useState({});
  const [pick, setPick] = useState({ gid: pgid || (groups[0] || {}).id, p: 1, date: today });
  const pickLessons = lessonsFor(db, app.me.id, pick.date).filter((x) => x.gid === pick.gid);
  if (!lessons.length || (pickMode && gid === undefined)) {
    return html`<div class="app"><${Band} nav=${nav} title="Subject register" sub="Pick the class and the period" />
      <main class="col gut content"><section class="card">
        ${groups.length === 0 ? html`<span class="small muted">You have no subject classes yet. Add one from an Excel class list.</span><button class="btn" onClick=${() => nav.go('upload')}>Add a class</button>` : html`
        <label class="f" for="pdt">Day<input id="pdt" type="date" class="inp" max=${realToday} value=${pick.date} onInput=${(e) => e.target.value && e.target.value <= realToday && setPick(Object.assign({}, pick, { date: e.target.value }))} /></label>
        ${pick.date !== realToday && html`<span class="small" style="color:var(--late-fg)">${fmtLong(pick.date)} · saved as a late entry.</span>`}
        ${pickLessons.length > 0 && html`<span class="small muted">On the timetable that day: ${pickLessons.map((x) => pLabel(x.p, x.len) + (x.off ? ' (not held)' : app.getRegister('p', pick.gid, pick.date, x.p) ? ' (done)' : '')).join(', ')}</span>`}
        <label class="f" for="pg">Class<select id="pg" class="inp" value=${pick.gid} onChange=${(e) => setPick(Object.assign({}, pick, { gid: e.target.value }))}>${groups.map((g) => html`<option value=${g.id}>${groupTitle(g)}</option>`)}</select></label>
        <span class="f">Period</span><div class="chips">${app.bells.map((b) => html`<button class="chip" aria-pressed=${String(pick.p === b.p)} onClick=${() => setPick(Object.assign({}, pick, { p: b.p }))}>P${b.p} · ${b.t}${pickLessons.some((x) => x.p === b.p) ? ' ★' : ''}</button>`)}</div>
        <button class="btn big" onClick=${() => nav.replace('period', { gid: pick.gid, p: pick.p, date: pick.date === realToday ? undefined : pick.date })}>Open register</button>`}
      </section></main></div>`;
  }
  const L = lessons[Math.min(cur, lessons.length - 1)];
  const g = db.groups.find((x) => x.id === L.gid);
  const key = regKey('p', g.id, today, L.p);
  const saved = db.registers[key];
  const accs = sortAcc(db, g.learners);
  const morningAbs = accs.filter((a) => morningMark(db, a, today) === 'A');
  const initial = () => (saved ? Object.assign({}, saved.marks) : morningAbs.reduce((o, a) => { o[a] = 'A'; return o; }, {}));
  const marks = drafts[key] || initial();
  const setMarks = (m) => setDrafts(Object.assign({}, drafts, { [key]: m }));
  const prevSlot = lessons.find((x) => x.gid === g.id && x.p + x.len === L.p);
  const prevKey = prevSlot ? regKey('p', g.id, today, prevSlot.p) : null;
  let a = 0, l = 0; accs.forEach((x) => { if (marks[x] === 'A') a++; if (marks[x] === 'L') l++; });
  const dirty = !!drafts[key];
  const coverOf = g.teacherId !== app.me.id ? g.teacherId : null;
  const submit = () => { const r = app.saveRegister({ kind: 'p', ref: g.id, date: today, period: L.p, marks, coverFor: coverOf }); const d = Object.assign({}, drafts); delete d[key]; setDrafts(d); app.toast(r.synced ? 'Saved. ' + a + ' absent, ' + l + ' late in ' + groupLabel(g) + ' P' + L.p + '.' : 'Saved on this phone. It will send when there is signal.'); };
  return html`<div class="app">
    <${Band} nav=${nav} title=${groupTitle(g)} sub=${fmtShort(today) + ' · ' + pLabel(L.p, L.len) + ' · ' + app.bellRange(L.p, L.len) + (prevSlot ? ' · straight after ' + pLabel(prevSlot.p, prevSlot.len) : '')} right=${html`<button class="ghost" onClick=${() => nav.go('print', { what: 'g:' + g.id })}>Month</button>`}>
      <div class="tabs" role="tablist" aria-label="Lesson">${lessons.map((x, i) => { const gg = db.groups.find((y) => y.id === x.gid); return html`<button role="tab" aria-selected=${String(i === cur)} onClick=${() => setCur(i)}>${groupLabel(gg)} · ${pLabel(x.p, x.len)}</button>`; })}
        <button role="tab" aria-selected="false" onClick=${() => nav.replace('period', { pick: true, date })}>+ Other</button></div>
      <div class="stats"><div class="stat"><b>${accs.length - a - l}</b><span>present</span></div><div class="stat"><b>${a}</b><span>absent</span></div><div class="stat"><b>${l}</b><span>late</span></div></div>
    <//>
    <${NetBar} />
    <div class="col">
      ${coverOf && html`<p class="note info">You are covering for <strong>${staffName(db, coverOf)}</strong>. The register is saved as taken by you (${app.me.code || app.me.name}), and your symbol shows on their printed register.</p>`}
      ${today !== realToday && html`<p class="note warn">Late entry for ${fmtLong(today)}. ${saved && !saved.lateEntry ? 'This register was taken on the day.' : 'The office sees it was filled in later.'}</p>`}
      ${L.off && html`<p class="note warn">This lesson shows as not held (${L.off === 'absent' ? 'you were marked absent' : 'after your sign-out'}). You can still take the register if it did happen.</p>`}

/* ================= import an Excel class list ================= */
function Upload({ nav, gid }) {
  const db = app.db;
  const pg = gid ? db.groups.find((x) => x.id === gid) : null;
  const [res, setRes] = useState(null), [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  const [subject, setSubject] = useState(''), [label, setLabel] = useState(''), [grade, setGrade] = useState('');
  const [slots, setSlots] = useState([]), [sd, setSd] = useState(1), [sp, setSp] = useState(1);
  const [all, setAll] = useState(false), [done, setDone] = useState(null);
  const onFile = (e) => {
    const f = e.target.files[0]; if (!f) return;
    setBusy(true); setErr('');
    const fr = new FileReader();
    fr.onload = () => { try { const r = parseClassList(new Uint8Array(fr.result), f.name); if (r.error) { setErr(r.error); setRes(null); } else { setRes(r); setSubject(pg ? pg.subject : r.subject); setLabel(pg ? pg.label : (r.cls || '')); setGrade(pg ? String(pg.grade || '') : (r.grade || '')); } } catch (x) { setErr('KAT could not read this file. Is it an Excel file (.xls or .xlsx)?'); } setBusy(false); };
    fr.readAsArrayBuffer(f);
  };
  if (done) return html`<div class="app"><${Band} nav=${nav} title="Class added" sub=${groupTitle(done)} /><main class="col gut content"><section class="card">
      <div class="boxnote ok"><span><strong>${groupTitle(done)} is ready.</strong> ${done.learners.length} learners.${done.replaced ? ' You already had this class, so its learner list was updated.' : ''} It now shows under "My classes" and has its own period register.</span></div>
      <button class="btn big" onClick=${() => nav.replace('period', { gid: done.id, p: (done.slots[0] || {}).p || 1 })}>Open the period register</button>
      <button class="btn line" onClick=${() => { setDone(null); setRes(null); }}>Add another class</button></section></main></div>`;
  const warns = [];
  if (res) {
    res.learners.forEach((l) => {
      const ex = db.learners[l.acc];
      if (ex && (ex.surname.toLowerCase() !== l.surname.toLowerCase())) warns.push('Accession number ' + l.acc + ' is ' + learnerShort(ex) + ' in KAT, but ' + l.first + ' ' + l.surname + ' in your file. KAT goes by the accession number.');
      Object.values(db.learners).forEach((o) => { if (o.acc !== l.acc && o.surname.toLowerCase() === l.surname.toLowerCase() && o.first.toLowerCase() === l.first.toLowerCase()) warns.push('Two learners called ' + l.surname.toUpperCase() + ', ' + l.first + ' have different accession numbers (' + l.acc + ' here, ' + o.acc + ' in ' + (o.cls || 'another list') + '). KAT keeps them apart by accession number, so check it is right.'); });
    });
  }
  const save = () => {
    if (!subject.trim() || !label.trim()) { app.toast('Fill in the subject and the class first.'); return; }
    const short = subject.trim().split(/\s+/).map((w) => w[0]).join('').toUpperCase().slice(0, 3);
    const g = pg ? app.setGroupLearners(pg.id, res.learners) : app.addGroup({ subject: subject.trim(), short, grade: Number(grade) || null, label: label.trim().toUpperCase(), teacherId: app.me.id, slots: slots.slice() }, res.learners);
    setDone(g);
  };
  return html`<div class="app"><${Band} nav=${nav} title=${pg ? 'Class list for ' + groupLabel(pg) : 'Add a class from Excel'} sub=${pg ? groupTitle(pg) + ' · from your timetable' : 'Use your SA-SAMS class list, marks and all'} />
    <main class="col gut content">
      <section class="card">
        <label class="btn big" for="xl" style="cursor:pointer"><${Icon} n="file" s=${20} />${res ? 'Choose a different file' : 'Choose an Excel file'}</label>
        <input id="xl" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="position:absolute;width:1px;height:1px;opacity:0" onChange=${onFile} />
        <span class="small muted" style="text-align:center">.xls or .xlsx, from your phone, WhatsApp or email</span>
        ${busy && html`<span class="small">Reading the file…</span>`}
        ${err && html`<div class="boxnote red"><span>${err}</span></div>`}
      </section>
      ${!res && html`<section class="card"><span class="eyebrow">What KAT looks for</span>
        <span class="small">A row with headings like <b>Acc No</b> and <b>Learner</b> or <b>Name</b>. Every row under it with an accession number and a "SURNAME, Name" becomes a learner.</span>
        <span class="small">It also reads the subject, grade and class from the top of the sheet when they are there.</span>
        <span class="small">Marks, tasks, averages and totals are ignored. Nothing in your file is changed.</span></section>`}
      ${res && html`<section class="card">
        <div><b style="font-size:18px">Found ${res.learners.length} learners</b><br /><span class="small muted">in "${res.filename}". Check the details, then save.</span></div>
        <div class="grid2"><label class="f" for="usub">Subject<input id="usub" class="inp" disabled=${!!pg} value=${subject} onInput=${(e) => setSubject(e.target.value)} /></label>
          <label class="f" for="ucls">Class<input id="ucls" class="inp" disabled=${!!pg} value=${label} onInput=${(e) => setLabel(e.target.value)} placeholder="8D" /></label>
          <label class="f" for="ugr">Grade<input id="ugr" class="inp" inputmode="numeric" value=${grade} onInput=${(e) => setGrade(e.target.value)} /></label></div>
        ${(res.subject || res.cls) && html`<span class="tiny muted">Read from the top of the sheet${res.teacher ? ' · teacher ' + res.teacher : ''}.</span>`}
        <div class="tablebox"><table class="t"><thead><tr><th>#</th><th>Acc No</th><th>Learner</th><th>G</th></tr></thead><tbody>
          ${(all ? res.learners : res.learners.slice(0, 6)).map((l, i) => html`<tr><td class="n">${i + 1}</td><td class="n">${l.acc}</td><td>${l.surname.toUpperCase()}, ${l.first}</td><td>${l.gender}</td></tr>`)}</tbody></table></div>

        ${warns.length > 0 && html`<div class="boxnote warn"><span><strong>Worth a look.</strong> ${warns.slice(0, 3).join(' ')}</span></div>`}
        <div class="boxnote info"><span><strong>Left out on purpose:</strong> marks and tasks${res.footer ? ', and ' + res.footer + ' "Average" or "Total" rows at the bottom' : ''}${res.skipped ? ', and ' + res.skipped + ' other rows without an accession number' : ''}.</span></div>
      </section>
      ${!pg && html`<section class="card"><span class="eyebrow">When do you teach ${label || 'this class'}? (optional)</span>
        <div class="wrap">${slots.map((x, i) => html`<button class="chip" aria-pressed="true" aria-label=${'Remove ' + DOW[x.d] + ' P' + x.p} onClick=${() => setSlots(slots.filter((_, j) => j !== i))}>${DOW[x.d]} P${x.p} ×</button>`)}</div>

        <span class="tiny muted">Or upload your timetable PDF and KAT fills in the times for every class.</span>
      </section>`}
      <button class="btn big" onClick=${save}>Save class</button>`}
    </main></div>`;
}

function ChangePw() {

  return html`<form class="card" onSubmit=${go}><span class="eyebrow">Change my password</span>
    <label class="f" for="cpo">Current password<input id="cpo" type="password" class="inp" autocomplete="current-password" value=${o} onInput=${(e) => setO(e.target.value)} /></label>

}

/* ================= change today's lessons (swap, move, cancel, extra, day swap) ================= */
function ChangeSheet({ lesson, lessons, onClose }) {
  const db = app.db, today = todayISO();
  const base = app.getChange(today);
  const [so, setSo] = useState(base.signout || nowHM());
  const ch = { absent: base.absent || undefined, signout: base.signout || undefined, dayAs: base.dayAs || null, moves: (base.moves || []).slice(), cancel: (base.cancel || []).slice(), extra: (base.extra || []).map((e) => Object.assign({}, e)) };
  const [xg, setXg] = useState((myGroups()[0] || {}).id), [xp, setXp] = useState(null);
  const save = (msg) => { app.setChange(today, ch); app.toast(msg); onClose(); };
  const setMove = (l, to) => {
    if (l.extra) { const e = ch.extra.find((x) => x.gid === l.gid && x.p === l.p); if (e) e.p = to; return; }
    ch.moves = ch.moves.filter((m) => !(m.gid === l.gid && m.from === l.orig));
    if (to !== l.orig) ch.moves.push({ gid: l.gid, from: l.orig, to });
  };
  const name = (l) => groupLabel(db.groups.find((g) => g.id === l.gid)) + ' · ' + pLabel(l.p, l.len);
  const same = (a, b) => a && b && a.gid === b.gid && a.p === b.p;
  const taken = (p, len, skip) => lessons.some((o) => !same(o, skip) && p < o.p + o.len && o.p < p + len);
  if (lesson && lesson.gid) {
    const others = lessons.filter((o) => !same(o, lesson));
    return html`<${Sheet} title=${'Change ' + name(lesson)} onClose=${onClose}>
      <span class="small muted">Only for today, ${fmtLong(today)}. Your normal timetable stays as it is.</span>
      ${others.length > 0 && html`<span class="eyebrow">Swap with another of your lessons</span><div class="chips">${others.map((o) => html`<button class="chip" onClick=${() => { const a = lesson.p, b = o.p; setMove(lesson, b); setMove(o, a); save(name(lesson) + ' and ' + name(o) + ' swapped for today.'); }}>${name(o)}</button>`)}</div>`}
      <span class="eyebrow">Move it to</span>
      <div class="chips">${app.bells.map((b) => html`<button class="chip" aria-pressed=${String(b.p === lesson.p)} disabled=${taken(b.p, lesson.len, lesson)} onClick=${() => { setMove(lesson, b.p); save(groupLabel(db.groups.find((g) => g.id === lesson.gid)) + ' moved to ' + pLabel(b.p, lesson.len) + ' for today.'); }}>P${b.p} · ${b.t}</button>`)}</div>
      <div class="wrap">
        <button class="btn soft" onClick=${() => { if (lesson.extra) ch.extra = ch.extra.filter((e) => !(e.gid === lesson.gid && e.p === lesson.p)); else { ch.moves = ch.moves.filter((m) => !(m.gid === lesson.gid && m.from === lesson.orig)); ch.cancel.push({ gid: lesson.gid, from: lesson.orig }); } save(name(lesson) + ' is off for today.'); }}>Not taught today</button>
        ${lesson.moved && html`<button class="btn line" onClick=${() => { setMove(lesson, lesson.orig); save('Back to ' + pLabel(lesson.orig, lesson.len) + '.'); }}>Back to ${pLabel(lesson.orig, lesson.len)}</button>`}
      </div>
    <//>`;
  }
  const xgroup = db.groups.find((g) => g.id === xg);
  return html`<${Sheet} title="Change today" onClose=${onClose}>
    <span class="small muted">For days when the timetable changes. Tap the ⇄ next to a lesson to swap or move just that one.</span>
    <span class="eyebrow">Away from school</span>
    <div class="wrap">
      <button class="btn soft" aria-pressed=${String(!!ch.absent)} onClick=${() => { ch.absent = !base.absent; delete ch.signout; save(ch.absent ? 'You are marked absent today. Your lessons need no register.' : 'You are marked present again.'); }}>${base.absent ? 'I am at school after all' : "I'm absent today"}</button>
    </div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><label class="f" for="so" style="flex-direction:row;align-items:center;gap:8px">Signed out at<input id="so" type="time" class="inp" style="width:auto" value=${so} onInput=${(e) => setSo(e.target.value)} /></label>
      <button class="btn line" disabled=${!so} onClick=${() => { ch.signout = so; delete ch.absent; save('Signed out at ' + so + '. Later lessons show as not held.'); }}>Sign out</button>
      ${base.signout && html`<button class="btn sm soft" onClick=${() => { delete ch.signout; save('Sign-out undone.'); }}>Undo sign-out</button>`}</div>
    <span class="tiny muted">Lessons that start at or after the sign-out time are not held, so they need no register and do not show as missed.</span>
    <span class="eyebrow">Today follows the timetable of</span>
    <div class="chips">${[null, 1, 2, 3, 4, 5].map((d) => html`<button class="chip" aria-pressed=${String((ch.dayAs || null) === d)} onClick=${() => { ch.dayAs = d; ch.moves = []; ch.cancel = []; save(d ? 'Today follows ' + DOW_LONG[d] + "'s timetable." : 'Back to the normal timetable for today.'); }}>${d ? DOW_LONG[d] : 'Normal (' + DOW[dow(today)] + ')'}</button>`)}</div>
    <span class="eyebrow">Add an extra lesson</span>
    <label class="f" for="xg">Class<select id="xg" class="inp" value=${xg} onChange=${(e) => setXg(e.target.value)}>${myGroups().map((g) => html`<option value=${g.id}>${groupTitle(g)}</option>`)}</select></label>
    <div class="chips">${app.bells.map((b) => html`<button class="chip" aria-pressed=${String(xp === b.p)} disabled=${taken(b.p, 1)} onClick=${() => setXp(b.p)}>P${b.p}</button>`)}</div>
    <button class="btn" disabled=${!xp || !xgroup} onClick=${() => { ch.extra.push({ gid: xg, p: xp, len: 1 }); save('Extra ' + groupLabel(xgroup) + ' lesson added at P' + xp + '.'); }}>Add extra lesson</button>
    ${ch.cancel.length > 0 && html`<span class="eyebrow">Off today</span>${ch.cancel.map((c) => html`<div class="between small"><span>${groupLabel(db.groups.find((g) => g.id === c.gid))} · P${c.from}</span><button class="btn sm line" onClick=${() => { ch.cancel = ch.cancel.filter((x) => x !== c); save('Lesson is back on.'); }}>Put back</button></div>`)}`}
    ${(ch.moves.length + ch.cancel.length + ch.extra.length > 0 || ch.dayAs) && html`<button class="btn soft" onClick=${() => { ch.dayAs = null; ch.moves = []; ch.cancel = []; ch.extra = []; save('All of today\'s changes undone.'); }}>Undo all of today's changes</button>`}
  <//>`;
}

/* ================= timetable upload (teacher: my timetable · admin: the whole school) ================= */
function Timetable({ nav, mode }) {
  const db = app.db, me = app.me, school = mode === 'school';
  const [pages, setPages] = useState(null), [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  const [pick, setPick] = useState(null), [addNew, setAddNew] = useState(true), [done, setDone] = useState(null);
  const onFile = (e) => {
    const f = e.target.files[0]; if (!f) return;
    setBusy(true); setErr(''); setPages(null);
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const all = await parseTimetablePdf(new Uint8Array(fr.result));
        const tps = all.filter((p) => p.kind === 'teacher');
        if (!tps.length) { setErr(all.length ? 'This looks like a class (learner) timetable. KAT needs the teacher timetable, where each page is headed "Teacher" and a name.' : 'KAT could not find a timetable in this PDF. It reads the PDFs that aSc Timetables prints, one teacher per page.'); }
        else { setPages(tps); const mine = tps.findIndex((p) => matchStaff(db, p.name) === me); setPick(mine >= 0 ? mine : 0); }
      } catch (x) { setErr('KAT could not read this PDF (' + (x.message || x) + ').'); }
      setBusy(false);
    };
    fr.readAsArrayBuffer(f);
  };
  const page = pages && pick !== null ? pages[pick] : null;
  const groupFor = (uid, l) => db.groups.find((g) => g.teacherId === uid && g.short === l.subject && g.label === l.label);
  const saveMine = () => { const n = app.applyTimetable(me.id, page); setDone({ lessons: page.lessons.length, created: n }); };
  const saveSchool = () => {
    let teachers = 0, created = 0, added = 0;
    pages.forEach((p) => {
      let st = matchStaff(db, p.name);
      if (!st && addNew) { st = app.addStaffQuiet({ name: titleCase(p.name), code: symbolGuess(p.name), short: titleCase(p.name), title: 'Teacher', role: 'teacher', registerClass: null, dhGrade: null }); added++; }
      if (!st) return;
      if (!st.code) st.code = symbolGuess(p.name);
      teachers++; created += app.applyTimetable(st.id, p);
    });
    setDone({ teachers, created, added });
  };
  if (done) return html`<div class="app"><${Band} nav=${nav} title="Timetable saved" sub=${school ? 'Whole school' : me.name} /><main class="col gut content"><section class="card">
    <div class="boxnote ok"><span>${school ? html`<strong>${done.teachers} teachers</strong> now have their lessons in KAT${done.added ? ', including ' + done.added + ' new staff members' : ''}. ${done.created} subject classes were set up. Each teacher still adds class lists for their classes.` : html`<strong>${done.lessons} lessons</strong> a week are now under "Period register".${done.created ? ' ' + done.created + ' classes are new, so add their class lists when you open them.' : ''}`} The bell times now match the timetable.</span></div>
    <button class="btn big" onClick=${() => nav.reset(me.role === 'teacher' ? 'home' : 'office')}>Done</button></section></main></div>`;
  const grid = (p, uid) => html`<div class="tablebox"><table class="t"><thead><tr><th>Day</th><th>Lessons</th></tr></thead><tbody>${[1, 2, 3, 4, 5].map((d) => html`<tr><td><b>${DOW[d]}</b></td><td><div class="wrap">${p.lessons.filter((l) => l.d === d).map((l) => { const g = uid && groupFor(uid, l); return html`<span class=${'pill ' + (g ? (g.learners.length ? 'ok' : 'wait') : 'info')} title=${g ? (g.learners.length ? g.learners.length + ' learners' : 'class list still needed') : 'new class'}>${pLabel(l.p, l.len)} ${l.subject} ${l.label}</span>`; })}</div></td></tr>`)}</tbody></table></div>`;
  const uniq = page ? [...new Set(page.lessons.map((l) => l.subject + '|' + l.label))] : [];
  return html`<div class="app"><${Band} nav=${nav} title=${school ? 'Upload school timetable' : 'Upload my timetable'} sub="The PDF from aSc Timetables, one teacher per page" />
    <main class="col gut content">
      <section class="card">
        <label class="btn big" for="ttf" style="cursor:pointer"><${Icon} n="file" s=${20} />${pages ? 'Choose a different PDF' : 'Choose the timetable PDF'}</label>
        <input id="ttf" type="file" accept="application/pdf,.pdf" style="position:absolute;width:1px;height:1px;opacity:0" onChange=${onFile} />
        <span class="small muted" style="text-align:center">Use the <b>teacher</b> timetable${school ? ' with every teacher in it' : ' (the whole school file is fine, KAT finds your page)'}.</span>
        ${busy && html`<span class="small">Reading the timetable…</span>`}
        ${err && html`<div class="boxnote red"><span>${err}</span></div>`}
      </section>
      ${page && !school && html`<section class="card">
        <label class="f" for="ttp">Whose timetable<select id="ttp" class="inp" value=${pick} onChange=${(e) => setPick(Number(e.target.value))}>${pages.map((p, i) => html`<option value=${i}>${p.name}${matchStaff(db, p.name) === me ? ' (you)' : ''}</option>`)}</select></label>
        ${matchStaff(db, page.name) !== me && html`<div class="boxnote warn"><span>This page is for ${page.name}, not ${me.name}. Check you picked the right one.</span></div>`}
        <b>${page.lessons.length} lessons a week in ${uniq.length} classes</b>
        ${grid(page, me.id)}
        <div class="legend"><span><i class="dot" style="background:var(--ok-fg)"></i>Matches a class you have</span><span><i class="dot" style="background:var(--wait-dot)"></i>Class list still needed</span><span><i class="dot" style="background:var(--info-fg)"></i>New class</span></div>
        <span class="small muted">Bell times from the PDF: ${page.bells.length} periods, ${page.bells[0].t} to ${page.bells[page.bells.length - 1].e}${page.brk ? ', break ' + page.brk.t + ' to ' + page.brk.e : ''}. A lesson over two periods (like P4–5) is one register.</span>
        <button class="btn big" onClick=${saveMine}>Use this timetable</button>
      </section>`}
      ${pages && school && html`<section class="card">
        <b>${pages.length} teachers found</b>
        <div class="tablebox" style="max-height:50vh;overflow:auto"><table class="t"><thead><tr><th>Timetable</th><th>In KAT</th><th>Lessons</th></tr></thead><tbody>${pages.map((p) => { const st = matchStaff(db, p.name); return html`<tr><td><b>${p.name}</b><br /><span class="tiny muted">${[...new Set(p.lessons.map((l) => l.subject))].join(', ')}</span></td><td>${st ? html`${st.name}${st.code ? html` <b>(${st.code})</b>` : ''}` : html`<span class="pill wait">New · ${symbolGuess(p.name)}</span>`}</td><td class="n">${p.lessons.length}</td></tr>`; })}</tbody></table></div>
        ${pages.some((p) => !matchStaff(db, p.name)) && html`<label class="check"><input type="checkbox" checked=${addNew} onChange=${(e) => setAddNew(e.target.checked)} /><span>Add the ${pages.filter((p) => !matchStaff(db, p.name)).length} teachers who are not in KAT yet as staff</span></label>`}
        <button class="btn big" onClick=${saveSchool}>Use this timetable for the school</button>
      </section>`}
      ${!pages && html`<section class="card"><span class="eyebrow">What KAT reads</span>
        <span class="small">Each page headed <b>Teacher</b> and a name, with periods across the top and Mo to Fr down the side.</span>
        <span class="small">In each block, the small code (NS, LO) is the subject and the big one (8E, 10) is the class. A block over two periods is one lesson.</span>
        <span class="small">After that, the ⇄ button next to a lesson swaps or moves it for one day without changing the timetable.</span></section>`}
    </main></div>`;
}

/* ================= router ================= */
const SCREENS = { home: Home, register: Register, cover: Cover, period: Period, reasons: Reasons, upload: Upload, incidents: Incidents, 'incident-new': IncidentNew, books: Books, 'book-new': BookNew, book: Book, find: Find, learner: Learner, print: PrintLists, office: Office, capture: Capture, records: Records, admin: AdminHub, schoolset: Admin, staff: Staff, learners: Learners, classes: Classes, yearend: YearEnd, settings: Settings, timetable: Timetable, missed: Missed, times: Times };
function Root() {
  const [, force] = useState(0);
  useEffect(() => app.subscribe(() => force((x) => x + 1)), []);
  const me = app.db && app.me;
  const start = me ? (me.role === 'teacher' ? 'home' : 'office') : null;
  const [stack, setStack] = useState([]);
  const sig = (app.session.schoolId || '') + ':' + (app.session.userId || '');
  const lastSig = useRef(sig);
  useEffect(() => { if (lastSig.current !== sig) { lastSig.current = sig; setStack([]); } }, [sig]);
  useEffect(() => { const c = app.db ? app.school.colors : SCHOOLS[0].colors; const r = document.documentElement.style; r.setProperty('--primary', c.primary); r.setProperty('--accent', c.accent); r.setProperty('--red', c.red); });
  if (app.cloud && app.cloud.dev) return html`<${Developer} /><${Toast} />`;
  if (!me) return html`<${Welcome} /><${Toast} />`;
  const cur = stack.length ? stack[stack.length - 1] : { name: start, params: {} };
  const nav = {
    go: (name, params) => { setStack(stack.concat([{ name, params: params || {}, k: Date.now() }])); window.scrollTo(0, 0); },
    replace: (name, params) => { setStack(stack.slice(0, -1).concat([{ name, params: params || {}, k: Date.now() }])); window.scrollTo(0, 0); },
    reset: (name, params) => { setStack(name === start ? [] : [{ name, params: params || {}, k: Date.now() }]); window.scrollTo(0, 0); },
    back: () => { setStack(stack.slice(0, -1)); window.scrollTo(0, 0); }
  };
  const S = SCREENS[cur.name] || Home;
  return html`<${S} key=${cur.name + (cur.k || '')} nav=${nav} ...${cur.params} /><${Toast} />`;
}
const mount = document.getElementById('teng'); mount.textContent = ''; render(html`<${Root} />`, mount);

</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script></body></html>
